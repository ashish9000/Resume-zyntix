name: Deploy ResumeAI India

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Groq API Key
        run: sed -i 's/YOUR_GROQ_KEY_HERE/${{ secrets.GROQ_API_KEY }}/g' index.html

      - name: Verify key was injected
        run: grep -c "GROQ_KEY_HERE" index.html && echo "KEY NOT INJECTED!" || echo "Key injected successfully"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          force_orphan: true
