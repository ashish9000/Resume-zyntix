// Wait for React to be ready
(function waitForReact() {
  if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
    setTimeout(waitForReact, 50);
    return;
  }
  initApp();
})();

function initApp() {
const {useState,useCallback,useEffect,createElement:h} = React;

// ── PLANS ──
const PLANS={
  free:{name:"Free",price:"₹0",period:"forever",color:"#2ecc71",icon:"🆓",
    limits:{aiSummary:true,aiBullets:1,aiSkills:false,templates:3,pdfExports:5,resumeBuilds:3}},
  pro:{name:"Pro",price:"₹1,249",period:"/month",color:"#0057FF",icon:"⚡",
    limits:{aiSummary:true,aiBullets:999,aiSkills:true,templates:50,pdfExports:999,resumeBuilds:999}},
  recruiter:{name:"Recruiter",price:"₹4,999",period:"/6 months",color:"#FF5733",icon:"🏢",
    limits:{aiSummary:true,aiBullets:999,aiSkills:true,templates:50,pdfExports:999,resumeBuilds:999,bulkReview:true}}
};

const INIT_FORM={
  name:"",email:"",phone:"",city:"",linkedin:"",portfolio:"",summary:"",
  college:"",degree:"",branch:"",cgpa:"",gradYear:"",
  school:"",board:"",marks10:"",year10:"",
  jobs:[{jobTitle:"",company:"",duration:"",location:"",bullets:""}],
  technicalSkills:"",softSkills:"",certifications:"",languages:"",tools:""
};

const SKILLS=["Java","Python","React","Angular","Spring Boot","MySQL","MongoDB","AWS","Docker","Git","REST API","Node.js","TypeScript","Tally","SAP","Excel","Power BI","Salesforce","JIRA","Agile/Scrum"];

// ── AI CALL via Groq (free, CORS-friendly) ──
// Get free key: https://console.groq.com → API Keys → Create
var GROQ_KEY = "YOUR_GROQ_KEY_HERE"; // <-- Apna Groq key yahan paste karo

async function callAI(system,user,maxTokens){
  maxTokens=maxTokens||600;
  if(!GROQ_KEY||GROQ_KEY===""){
    throw new Error("Groq API key missing! File mein GROQ_KEY set karo.");
  }
  var res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},
    body:JSON.stringify({
      model:"llama-3.3-70b-versatile",
      max_tokens:maxTokens,
      messages:[
        {role:"system",content:system},
        {role:"user",content:user}
      ]
    })
  });
  if(!res.ok){
    var err=await res.json().catch(function(){return {};});
    throw new Error(err.error&&err.error.message?err.error.message:"Groq error "+res.status);
  }
  var d=await res.json();
  return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
}

// ── BUILD RESUME HTML ──
function buildResume(d,tpl){
  var ac={modern:"#0057FF",classic:"#1a1a2e",minimal:"#2ecc71",creative:"#FF5733"}[tpl]||"#0057FF";
  var jobs=(d.jobs||[]).filter(function(j){return j.company;}).map(function(j){
    var bullets=j.bullets?j.bullets.split("\n").filter(Boolean).map(function(b){
      return '<div style="font-size:9pt;color:#444;padding-left:10px;margin-bottom:2px;">'+(b.trim().startsWith("•")?b.trim():"• "+b.trim())+'</div>';
    }).join(""):"";
    return '<div style="margin-bottom:10px;">'+
      '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;">'+
      '<span style="font-weight:700;font-size:10pt;">'+j.jobTitle+'</span>'+
      '<span style="font-size:8.5pt;color:#888;">'+j.duration+'</span></div>'+
      '<div style="color:'+ac+';font-weight:600;font-size:9pt;margin-bottom:3px;">'+j.company+(j.location?" · "+j.location:"")+'</div>'+
      bullets+'</div>';
  }).join("");

  var edu=d.college?
    '<div style="margin-bottom:8px;">'+
    '<div style="font-weight:700;font-size:9.5pt;">'+(d.degree||"")+" "+(d.branch||"")+'</div>'+
    '<div style="font-size:8.5pt;color:#555;">'+d.college+'</div>'+
    '<div style="font-size:8.5pt;color:#888;">'+(d.cgpa||"")+(d.gradYear?" · "+d.gradYear:"")+'</div></div>'+
    (d.school?'<div style="margin-bottom:6px;"><div style="font-weight:700;font-size:9pt;">12th '+(d.board?"— "+d.board:"")+'</div>'+
    '<div style="font-size:8.5pt;color:#666;">'+d.school+(d.marks10?" · "+d.marks10:"")+(d.year10?" · "+d.year10:"")+'</div></div>':"")
    :"";

  var skills=(d.technicalSkills||"").split(",").filter(Boolean).map(function(s){
    return '<span style="background:'+ac+'18;color:'+ac+';border-radius:3px;padding:2px 7px;font-size:8pt;font-weight:700;margin:2px 2px 0 0;display:inline-block;">'+s.trim()+'</span>';
  }).join("");

  function sec(title,content){
    return '<div style="margin-bottom:12px;">'+
      '<div style="font-size:8pt;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:'+ac+';border-bottom:1.5px solid '+ac+'44;padding-bottom:3px;margin-bottom:7px;">'+title+'</div>'+
      content+'</div>';
  }

  var extras=
    (d.tools?sec("Tools & Software",'<div style="font-size:9pt;color:#444;">'+d.tools+'</div>'):"") +
    (d.softSkills?sec("Soft Skills",'<div style="font-size:9pt;color:#444;">'+d.softSkills+'</div>'):"") +
    (d.certifications?sec("Certifications",'<div style="font-size:9pt;color:#444;">'+d.certifications+'</div>'):"") +
    (d.languages?sec("Languages",'<div style="font-size:9pt;color:#444;">'+d.languages+'</div>'):"");

  if(tpl==="classic") return '<div style="font-family:Georgia,serif;font-size:10pt;color:#1a1a2e;line-height:1.6;padding:22px 26px;">'+
    '<div style="text-align:center;border-bottom:2px solid #1a1a2e;padding-bottom:12px;margin-bottom:14px;">'+
    '<div style="font-size:19pt;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;">'+(d.name||"Your Name")+'</div>'+
    '<div style="font-size:8.5pt;color:#555;margin-top:4px;">'+ [d.email,d.phone,d.city,d.linkedin].filter(Boolean).join("  |  ") +'</div></div>'+
    (d.summary?sec("Objective",'<div style="font-size:9.5pt;color:#333;">'+d.summary+'</div>'):"") +
    (jobs?sec("Work Experience",jobs):"") +
    (edu?sec("Education",edu):"") +
    (d.technicalSkills?sec("Technical Skills",'<div style="font-size:9.5pt;color:#333;">'+(d.technicalSkills||"").split(",").filter(Boolean).join("  ·  ")+'</div>'):"") +
    extras+'</div>';

  if(tpl==="minimal") return '<div style="font-family:Arial,sans-serif;font-size:10pt;color:#1a1a2e;line-height:1.55;padding:22px 26px;">'+
    '<div style="margin-bottom:12px;"><div style="font-size:20pt;font-weight:800;color:#1a1a2e;margin-bottom:4px;">'+(d.name||"Your Name")+'</div>'+
    '<div style="font-size:8.5pt;color:#888;">'+ [d.email,d.phone,d.city,d.linkedin].filter(Boolean).join("  •  ") +'</div>'+
    '<div style="height:2px;background:#2ecc71;margin-top:8px;border-radius:2px;"></div></div>'+
    (d.summary?'<div style="margin-bottom:12px;"><div style="font-size:8.5pt;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;">Summary</div><div style="font-size:9.5pt;color:#444;">'+d.summary+'</div></div>':"") +
    (jobs?'<div style="margin-bottom:12px;"><div style="font-size:8.5pt;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;">Experience</div>'+jobs+'</div>':"") +
    (edu?'<div style="margin-bottom:12px;"><div style="font-size:8.5pt;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;">Education</div>'+edu+'</div>':"") +
    (d.technicalSkills?'<div style="margin-bottom:12px;"><div style="font-size:8.5pt;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;">Skills</div>'+skills+'</div>':"") +
    extras+'</div>';

  if(tpl==="creative") return '<div style="font-family:Arial,sans-serif;font-size:10pt;color:#1a1a2e;line-height:1.55;display:flex;min-height:500px;">'+
    '<div style="width:30%;background:#1e1e2e;padding:18px 12px;flex-shrink:0;">'+
    '<div style="border-bottom:2px solid #FF5733;padding-bottom:12px;margin-bottom:14px;">'+
    '<div style="font-size:14pt;font-weight:800;color:#fff;line-height:1.2;margin-bottom:5px;">'+(d.name||"Your Name")+'</div>'+
    (d.jobs&&d.jobs[0]&&d.jobs[0].jobTitle?'<div style="font-size:8pt;color:#FF5733;font-weight:700;text-transform:uppercase;">'+d.jobs[0].jobTitle+'</div>':"") +
    '</div><div style="font-size:8pt;font-weight:800;text-transform:uppercase;color:#FF5733;margin-bottom:6px;">Contact</div>'+
    [d.email,d.phone,d.city,d.linkedin].filter(Boolean).map(function(v){return '<div style="font-size:7.5pt;color:#aaa;margin-bottom:3px;word-break:break-all;">'+v+'</div>';}).join("")+
    (d.technicalSkills?'<div style="font-size:8pt;font-weight:800;text-transform:uppercase;color:#FF5733;margin:12px 0 8px;">Skills</div>'+
    (d.technicalSkills||"").split(",").slice(0,8).map(function(s,i){
      return '<div style="margin-bottom:5px;"><div style="font-size:8pt;color:#ccc;margin-bottom:2px;">'+s.trim()+'</div>'+
      '<div style="height:3px;background:rgba(255,255,255,0.1);border-radius:2px;"><div style="height:100%;width:'+(65+(i%4)*9)+'%;background:#FF5733;border-radius:2px;"></div></div></div>';
    }).join(""):"") +
    (d.languages?'<div style="font-size:8pt;font-weight:800;text-transform:uppercase;color:#FF5733;margin:10px 0 6px;">Languages</div><div style="font-size:8pt;color:#aaa;">'+d.languages+'</div>':"") +
    '</div><div style="flex:1;padding:18px 16px;">'+
    (d.summary?'<div style="margin-bottom:12px;"><div style="font-size:8pt;font-weight:800;text-transform:uppercase;color:#FF5733;border-bottom:1.5px solid #FF573333;padding-bottom:3px;margin-bottom:7px;">Profile</div><div style="font-size:9.5pt;color:#444;">'+d.summary+'</div></div>':"") +
    (jobs?'<div style="margin-bottom:12px;"><div style="font-size:8pt;font-weight:800;text-transform:uppercase;color:#FF5733;border-bottom:1.5px solid #FF573333;padding-bottom:3px;margin-bottom:8px;">Experience</div>'+jobs+'</div>':"") +
    (edu?'<div style="margin-bottom:12px;"><div style="font-size:8pt;font-weight:800;text-transform:uppercase;color:#FF5733;border-bottom:1.5px solid #FF573333;padding-bottom:3px;margin-bottom:8px;">Education</div>'+edu+'</div>':"") +
    (d.certifications?'<div><div style="font-size:8pt;font-weight:800;text-transform:uppercase;color:#FF5733;border-bottom:1.5px solid #FF573333;padding-bottom:3px;margin-bottom:6px;">Certifications</div><div style="font-size:9pt;color:#444;">'+d.certifications+'</div></div>':"") +
    '</div></div>';

  // Modern Pro (default)
  return '<div style="font-family:Arial,sans-serif;font-size:10pt;color:#1a1a2e;line-height:1.55;">'+
    '<div style="background:#0057FF;padding:18px 22px;color:#fff;">'+
    '<div style="font-size:20pt;font-weight:800;margin-bottom:4px;">'+(d.name||"Your Name")+'</div>'+
    '<div style="font-size:8.5pt;opacity:0.88;">'+ [d.email,d.phone,d.city,d.linkedin,d.portfolio].filter(Boolean).join("  •  ") +'</div></div>'+
    '<div style="padding:16px 22px;">'+
    (d.summary?sec("Professional Summary",'<div style="font-size:9.5pt;color:#444;">'+d.summary+'</div>'):"") +
    '<div style="display:grid;grid-template-columns:1fr 0.5fr;gap:18px;">'+
    '<div>'+(jobs?sec("Work Experience",jobs):"")+'</div>'+
    '<div>'+(edu?sec("Education",edu):"")+
    (d.technicalSkills?sec("Technical Skills",skills):"") +
    (d.tools?sec("Tools",'<div style="font-size:8.5pt;color:#444;">'+d.tools+'</div>'):"") +
    (d.softSkills?sec("Soft Skills",'<div style="font-size:8.5pt;color:#444;">'+d.softSkills+'</div>'):"") +
    (d.certifications?sec("Certifications",'<div style="font-size:8.5pt;color:#444;">'+d.certifications+'</div>'):"") +
    (d.languages?sec("Languages",'<div style="font-size:8.5pt;color:#444;">'+d.languages+'</div>'):"") +
    '</div></div></div></div>';
}

// ── PRINT PDF ──
function printResume(html,fileName){
  var old=document.getElementById("pframe");
  if(old)old.remove();
  var f=document.createElement("div");
  f.id="pframe";
  f.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f0f0;z-index:99999;display:flex;flex-direction:column;overflow:auto;";
  f.innerHTML=
    '<div class="no-print" style="background:#0057FF;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0;">'+
    '<span style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">📄 '+fileName+'</span>'+
    '<div style="display:flex;gap:8px;flex-shrink:0;">'+
    '<button id="savebtn" style="background:#fff;color:#0057FF;border:none;border-radius:8px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;">💾 Save as PDF</button>'+
    '<button id="closebtn" style="background:rgba(255,255,255,0.25);color:#fff;border:none;border-radius:8px;padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer;">✕</button>'+
    '</div></div>'+
    '<div class="no-print" style="background:#f39c12;color:#fff;padding:8px 16px;font-size:12px;font-weight:600;flex-shrink:0;">'+
    '📱 Android: Tap Save as PDF → then browser 3-dot menu → Print → Save as PDF'+
    '</div>'+
    '<div style="flex:1;overflow:auto;padding:16px;">'+
    '<div style="max-width:760px;margin:0 auto;box-shadow:0 2px 20px rgba(0,0,0,0.15);">'+html+'</div>'+
    '</div>';
  document.body.appendChild(f);
  document.getElementById("savebtn").onclick=function(){window.print();};
  document.getElementById("closebtn").onclick=function(){f.remove();};
}

// ── SIMPLE UI HELPERS ──
function btn(text,onClick,style){
  var b=document.createElement("button");
  b.textContent=text;
  b.onclick=onClick;
  Object.assign(b.style,{fontFamily:"Arial,sans-serif",cursor:"pointer"},style||{});
  return b;
}

// ─── REACT COMPONENTS ───────────────────────────────────────────────────────

function Toast(props){
  if(!props.msg)return null;
  var bg={success:"#2ecc71",error:"#e74c3c",info:"#0057FF",warning:"#f39c12"};
  return h("div",{style:{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",zIndex:9999,background:bg[props.type]||bg.info,color:"#fff",borderRadius:10,padding:"11px 22px",fontSize:13,fontWeight:700,boxShadow:"0 8px 32px rgba(0,0,0,0.5)",whiteSpace:"nowrap"}},props.msg);
}

function Inp(props){
  return h("div",{style:{marginBottom:14}},
    props.label&&h("label",{style:{display:"block",fontSize:11,fontWeight:700,color:"#7a90aa",marginBottom:5,textTransform:"uppercase",letterSpacing:0.5}},props.label,props.required&&h("span",{style:{color:"#FF5733"}}," *")),
    h("input",{type:props.type||"text",value:props.value,onChange:function(e){props.onChange(e.target.value);},placeholder:props.placeholder||"",style:{width:"100%",background:"rgba(255,255,255,0.07)",border:"1.5px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"11px 13px",color:"#e8eef8",fontSize:14,fontFamily:"inherit",boxSizing:"border-box"}})
  );
}

function Txta(props){
  return h("div",{style:{marginBottom:14}},
    props.label&&h("label",{style:{display:"block",fontSize:11,fontWeight:700,color:"#7a90aa",marginBottom:5,textTransform:"uppercase",letterSpacing:0.5}},props.label),
    h("textarea",{value:props.value,onChange:function(e){props.onChange(e.target.value);},placeholder:props.placeholder||"",rows:props.rows||4,style:{width:"100%",background:"rgba(255,255,255,0.07)",border:"1.5px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"11px 13px",color:"#e8eef8",fontSize:14,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box"}}),
    props.hint&&h("div",{style:{fontSize:11,color:"#445566",marginTop:4}},props.hint)
  );
}

function Card(props){
  return h("div",{style:Object.assign({background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20},props.style||{})},props.children);
}

function AIBtn(props){
  return h("button",{
    onClick:props.locked?undefined:props.onClick,
    disabled:props.busy,
    style:{background:props.locked?"rgba(255,255,255,0.04)":props.busy?"rgba(0,87,255,0.3)":(props.color||"#0057FF"),color:props.locked?"#445":"#fff",border:"none",borderRadius:8,padding:"7px 14px",fontSize:11,fontWeight:700,cursor:(props.locked||props.busy)?"not-allowed":"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}
  },props.busy?"⏳ Generating...":props.locked?("🔒 "+props.label):("✨ "+props.label));
}

function Bton(props){
  return h("button",{
    onClick:props.onClick,
    disabled:props.disabled,
    style:Object.assign({fontFamily:"Arial,sans-serif",cursor:props.disabled?"not-allowed":"pointer"},props.style||{})
  },props.children);
}

      ),

      h("div",{style:{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}},

      h(Card,null,

        ),
        h("textarea",{value:jd,onChange:function(e){setJd(e.target.value);},placeholder:"Paste JD from Naukri/LinkedIn...",rows:11,style:{width:"100%",background:"rgba(255,255,255,0.05)",border:"1.5px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"11px 13px",color:"#e8eef8",fontSize:13,fontFamily:"inherit",resize:"vertical",boxSizing:"border-box"}})
      )
    ),
    h("div",{style:{textAlign:"center",marginBottom:18}},
      h(Bton,{onClick:analyze,disabled:loading,style:{background:loading?"rgba(0,87,255,0.4)":"#0057FF",color:"#fff",border:"none",borderRadius:12,padding:"13px 40px",fontSize:15,fontWeight:800,boxShadow:"0 4px 20px rgba(0,87,255,0.4)"}},loading?"⏳ Analyzing...":"🔍 Check ATS Score")
    ),
    result&&h("div",null,
      h("div",{style:{background:(vc[result.verdict]||"#0057FF")+"15",border:"1px solid "+(vc[result.verdict]||"#0057FF")+"44",borderRadius:14,padding:"14px 18px",marginBottom:14,display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}},
        h("div",{style:{fontSize:28}},result.verdict==="Excellent"?"🏆":result.verdict==="Good"?"👍":result.verdict==="Average"?"⚠️":"🔧"),
        h("div",{style:{flex:1}},
          h("div",{style:{fontSize:17,fontWeight:800,color:vc[result.verdict]}},result.verdict+"!"),
          h("div",{style:{fontSize:13,color:"#8899bb",marginTop:2}},result.verdictReason)
        ),
        h("div",{style:{textAlign:"center"}},
          h("div",{style:{fontSize:40,fontWeight:800,color:vc[result.verdict]}},result.overallScore),
          h("div",{style:{fontSize:11,color:"#556677"}},"ATS Score")

      ),
      h("div",{style:{display:"flex",gap:6,marginBottom:12,overflowX:"auto"}},
        ["score","keywords","suggestions"].map(function(id){
          return h(Bton,{key:id,onClick:function(){setTab(id);},style:{background:tab===id?"#0057FF":"rgba(255,255,255,0.05)",color:tab===id?"#fff":"#8899bb",border:"none",borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,whiteSpace:"nowrap"}},id==="score"?"📊 Scores":id==="keywords"?"🔑 Keywords":"💡 Suggestions");
        })

      tab==="score"&&h(Card,null,

            h("div",{style:{height:6,background:"rgba(255,255,255,0.07)",borderRadius:20}},
              h("div",{style:{height:"100%",width:val.score+"%",background:val.score>=75?"#2ecc71":val.score>=50?"#f39c12":"#e74c3c",borderRadius:20}})
            ),
            val.feedback&&h("div",{style:{fontSize:11,color:"#556677",marginTop:3}},val.feedback)
          );
        })
      ),
      tab==="keywords"&&h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        [["✅ Found",(result.sections&&result.sections.keywords&&result.sections.keywords.found)||[],"#2ecc71"],
         ["❌ Missing",(result.sections&&result.sections.keywords&&result.sections.keywords.missing)||[],"#e74c3c"]].map(function(entry){
          var label=entry[0],items=entry[1],color=entry[2];
          return h(Card,{key:label},
            h("div",{style:{fontSize:13,fontWeight:700,color:color,marginBottom:10}},label+" ("+items.length+")"),
            h("div",null,items.map(function(k){return h("span",{key:k,style:{display:"inline-block",background:color+"15",color:color,border:"1px solid "+color+"33",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700,margin:"2px"}},k);}))

      tab==="suggestions"&&h(Card,null,
        h("div",{style:{fontWeight:700,fontSize:14,color:"#c0cce0",marginBottom:14}},"💡 Top Suggestions"),
